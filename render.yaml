services:
  - type: web
    name: onboarding-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install && cd ../frontend && npm install && npm run build && cp -r dist/* ../backend/public/
    startCommand: cd backend && node index.js
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
